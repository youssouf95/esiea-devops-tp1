services:
  app-blue:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["blue"]
    ports:
      - "5001:5000"
    environment:
      REDIS_HOST: redis
      DEPLOY_COLOR: blue
    networks:
      - app-network

  app-green:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["green"]
    ports:
      - "5002:5000"
    environment:
      REDIS_HOST: redis
      DEPLOY_COLOR: green
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network

networks:
  app-network:

volumes:
  redis-data: